[package]
name = "polystore-kv-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server wrapping polystore::KvStore implementations (Bytes-in/Bytes-out)"
license = "MIT"
repository = "https://github.com/anatta-rs/polystore-kv-server"
keywords = ["kv", "http", "polystore", "server"]
categories = ["database", "web-programming::http-server"]

[[bin]]
name = "polystore-kv-server"
path = "src/main.rs"

[dependencies]
polystore-rocksdb = { git = "https://github.com/anatta-rs/polystore-rocksdb", branch = "main" }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
