[package]
name = "kv-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server for any polystore::KvStore implementation. Backends: rocksdb (default), sled, memory."
license = "MIT"
repository = "https://github.com/anatta-rs/kv-server"
keywords = ["kv", "http", "polystore", "server"]
categories = ["database", "web-programming::http-server"]

[[bin]]
name = "kv-server"
path = "src/bin/kv-server.rs"
required-features = ["rocksdb-backend"]

[lib]
name = "kv_server"
path = "src/lib.rs"

[features]
default = ["rocksdb-backend"]
rocksdb-backend = ["dep:rocksdb"]
sled-backend = ["dep:sled"]
memory-backend = []

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
rocksdb = { version = "0.23", optional = true }
sled = { version = "0.34", optional = true }
reqwest = { version = "0.12", features = ["json"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
